
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10131b">
  <title>Chess Academy</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #10131b;
      color: #f1f3f8;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #292e3b;
      background: #151925;
    }

    header h1 { margin: 0; font-size: 23px; }

    header p {
      color: #969fb1;
      margin-bottom: 0;
      font-size: 13px;
    }

    main {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 15px;
    }

    .panel {
      background: #191f2c;
      border: 1px solid #2b3343;
      border-radius: 15px;
      padding: 14px;
      margin-bottom: 15px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: 8px;
      border: 3px solid #343d50;
    }

    .square {
      border: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(24px, 8vw, 54px);
      cursor: pointer;
      user-select: none;
    }

    .light { background: #e8e1d2; }
    .dark { background: #77927f; }

    .white-piece {
      color: white;
      text-shadow: 1px 2px 2px #222;
    }

    .black-piece {
      color: #17191e;
      text-shadow: 1px 1px 1px #fff6;
    }

    .selected { background: #e8c34c !important; }

    .possible { outline: 4px solid #a5c4a0; outline-offset: -4px; }

    .last-move { box-shadow: inset 0 0 0 4px #e8c34c88; }

    button, select { font: inherit; }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
      margin-top: 12px;
    }

    .action {
      padding: 12px;
      border: 1px solid #394458;
      border-radius: 9px;
      background: #252e40;
      color: white;
      font-weight: bold;
    }

    .primary {
      background: #4269b2;
      border-color: #4269b2;
    }

    h2 { font-size: 16px; margin: 0 0 12px; }

    #status {
      color: #a8c7ff;
      font-size: 14px;
      margin-top: 12px;
    }

    #lia-message, #lesson {
      color: #d2d8e5;
      line-height: 1.5;
      font-size: 14px;
    }

    #moves {
      max-height: 180px;
      overflow-y: auto;
    }

    .move-row {
      display: grid;
      grid-template-columns: 40px 1fr 1fr;
      padding: 7px;
      border-bottom: 1px solid #30394a;
      font-size: 14px;
    }

    .move-row span:first-child { color: #8e9bb0; }

    select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #394458;
      background: #252e40;
      color: white;
      margin-top: 8px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #707b8e;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <header>
    <h1>♟ Chess Academy</h1>
    <p>Aprenda, pratique e descubra o mundo do xadrez.</p>
  </header>

  <main>
    <section class="panel">
      <h2>Tabuleiro</h2>
      <div id="board" class="board"></div>
      <div id="status">Carregando partida...</div>

      <div class="controls">
        <button class="action primary" id="new-game">Nova partida</button>
        <button class="action" id="undo">Desfazer</button>
        <button class="action" id="hint">Dica da Lia</button>
        <button class="action" id="analyze">Analisar</button>
        <button class="action" id="flip">Girar tabuleiro</button>
        <button class="action" id="lesson-button">Aula rápida</button>
      </div>
    </section>

    <section class="panel">
      <h2>Adversário</h2>
      <label for="level">Dificuldade</label>
      <select id="level">
        <option value="1">Nível 1 - Iniciante</option>
        <option value="2">Nível 2 - Fácil</option>
        <option value="3" selected>Nível 3 - Intermediário</option>
        <option value="4">Nível 4 - Avançado</option>
        <option value="5">Nível 5 - Difícil</option>
      </select>
    </section>

    <section class="panel">
      <h2>👩‍🏫 Lia, sua professora</h2>
      <p id="lia-message">Preparando a aula...</p>
      <p id="lesson"></p>
    </section>

    <section class="panel">
      <h2>Histórico de movimentos</h2>
      <div id="moves"></div>
    </section>
  </main>

  <footer>Chess Academy · Aprender é o primeiro movimento.</footer>

  <script type="module" src="./app.js"></script>
</body>
</html>


name: Chess Academy - Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Construir aplicação
        run: npm run build

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Preparar Gradle
        run: chmod +x ./gradlew
        working-directory: android

      - name: Construir APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Publicar APK em Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Chess Academy - Build ${{ github.run_number }}
          generate_release_notes: true
          make_latest: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true

      - name: Guardar APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chess-Academy-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
